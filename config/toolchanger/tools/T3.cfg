
# This file contains pin mappings for the LDO Nitehawk-36 Toolboard
# To use this config, the firmware should be compiled for the Raspberry Pi RP2040
# Make sure to include this config *at the end* of printer.cfg to overwrite the relevent sections

# See https://docs.ldomotors.com/en/Toolboard/nitehawk-36#firmware-setup-and-update
# For instructions on uploading/updating klipper firmware to the PCB

# See docs/Config_Reference.md for a description of parameters.

[mcu nitehawk_T3]
serial: /dev/serial/by-id/usb-Klipper_rp2040_nitehawk_t3-if00
restart_method: command

#####################################################################
#   Tool Settings
#####################################################################

#change the tool numbers to the tool you are configuring, ie T3, T1, etc
[tool T3]
#change this too
tool_number: 3
#if this were T1, then this would be extruder1, etc
extruder: extruder3
#Change T3_partfan to tool number
fan: T3_part_fan

#These are build specific, its where the tool is sititng in it's dock.

params_park_x: 295
params_park_y: 7
params_park_z: 290.2
gcode_x_offset: 0 # The X-Axis offset of the nozzle's orifice in relation to tool 0
gcode_y_offset: 0 # The Y-Axis offset of the nozzle's orifice in relation to tool 0
gcode_z_offset: 0 # The Z-Axis offset of the nozzle's orifice in relation to tool 0

# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 52
params_input_shaper_damping_ratio_x: 0.098
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 37.2
params_input_shaper_damping_ratio_y: 0.088

#####################################################################
#   Endstops
#####################################################################
## XES - Toolhead PCB
# [stepper_x]
# endstop_pin: nhk:gpio13

#####################################################################
#   Filament Sensor
#####################################################################
#[filament_switch_sensor filament_sensor]
#switch_pin: nhk:gpio3
#pause_on_runout: True

#####################################################################
# 	Extruder
#####################################################################
[extruder3]
step_pin: nitehawk_T3:gpio23
dir_pin: !nitehawk_T3:gpio24
enable_pin: !nitehawk_T3:gpio25
heater_pin: nitehawk_T3:gpio9
sensor_pin: nitehawk_T3:gpio29
pullup_resistor: 2200
sensor_type: ATC Semitec 104NT-4-R025H42G

microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 4.69
nozzle_diameter: 0.400
filament_diameter: 1.750
min_extrude_temp: 170
min_temp: 0
max_temp: 270
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025 #to be calibrated
pressure_advance_smooth_time: 0.03 #to be calibrated

control: pid
pid_Kp: 32.389
pid_Ki: 4.152
pid_Kd: 63.159

[tmc2209 extruder3]
uart_pin: nitehawk_T3:gpio0
tx_pin: nitehawk_T3:gpio1
interpolate: false
run_current: 0.85
sense_resistor: 0.11
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4


#####################################################################
#   Fans
#####################################################################
## PCF
[fan_generic T3_part_fan]
pin: nitehawk_T3:gpio6


## HEF
[heater_fan T3_hotend_fan]
pin: nitehawk_T3:gpio5
tachometer_pin: nitehawk_T3:gpio16
tachometer_ppr: 2
heater: extruder3
heater_temp: 50.0

#####################################################################
# 	Probe
#####################################################################
## Probe Port
# [probe]
# pin: nhk:gpio10
[tool_probe T3]
pin: nitehawk_T3:gpio10
tool: 3
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
z_offset: 0
# More positive = More Squish
# z_offset = -1.170 # TEXTURED PLATE
#z_offset = -1.290 #-1.390 # SMOOTH PLATE
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.01
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder3

#####################################################################
#   Lights
#####################################################################
##Stealthburner Headlights
[neopixel T3_leds]
pin: nitehawk_T3:gpio7
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 1.0

## PCB Activity Light
[output_pin T3_act_led]
pin: !nitehawk_T3:gpio8

#####################################################################
#   Accelerometer
#####################################################################
[adxl345 T3]
cs_pin: nitehawk_T3:gpio27
spi_software_sclk_pin: nitehawk_T3:gpio18
spi_software_mosi_pin: nitehawk_T3:gpio20
spi_software_miso_pin: nitehawk_T3:gpio19
axes_map: x,z,-y

[resonance_tester]
accel_chip: adxl345 T3
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0
##--------------------------------------------------------------------
## Uncomment below for 250mm build
#probe_points:
#    125, 125, 20

## Uncomment below for 300mm build
probe_points:
   155, 155, 20

## Uncomment below for 350mm build
#probe_points:
#    175, 175, 20


#####################################################################
#   Custom GCODE
#####################################################################

[gcode_macro T3]
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=3